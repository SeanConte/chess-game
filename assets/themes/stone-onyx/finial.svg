<svg xmlns="http://www.w3.org/2000/svg" width="220" height="120" viewBox="0 0 220 120">
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#3a3f45"/><stop offset=".45" stop-color="#1b1f24"/><stop offset="1" stop-color="#06080a"/>
</linearGradient>
<linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#9fd8ff"/><stop offset=".35" stop-color="#3f8fe0"/>
 <stop offset=".7" stop-color="#1b4fa8"/><stop offset="1" stop-color="#0a1e52"/>
</linearGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5">
 <stop offset="0" stop-color="rgba(96,180,255,.55)"/><stop offset="1" stop-color="rgba(96,180,255,0)"/>
</radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
</defs>
<ellipse cx="110" cy="60" rx="86" ry="52" fill="url(#halo)"/>
<!-- outer dark lozenge -->
<polygon points="110,6 178,60 110,114 42,60" fill="url(#metal)" stroke="#c29c5f" stroke-width="1.6"/>
<polygon points="110,13 169,60 110,107 51,60" fill="none" stroke="#0a0c0e" stroke-width="3"/>
<polygon points="110,16 165,60 110,104 55,60" fill="none" stroke="rgba(215,178,112,.55)" stroke-width="1"/>
<!-- facet shading -->
<polygon points="110,6 178,60 110,60" fill="rgba(255,255,255,.05)"/>
<polygon points="110,114 42,60 110,60" fill="rgba(0,0,0,.35)"/>
<!-- gem -->
<polygon points="110,26 148,60 110,94 72,60" fill="url(#gem)" stroke="#bfe6ff" stroke-width="1.4"/>
<polyline points="72,60 110,52 148,60 110,68 72,60" fill="none" stroke="rgba(230,248,255,.7)" stroke-width="1.2"/>
<line x1="110" y1="26" x2="110" y2="94" stroke="rgba(230,248,255,.4)" stroke-width="1.2"/>
<!-- star sparkle -->
<g filter="url(#soft)">
<polygon points="110,38 114,56 132,60 114,64 110,82 106,64 88,60 106,56" fill="#eaf7ff"/>
</g>
<circle cx="110" cy="60" r="3.4" fill="#ffffff"/>
</svg>